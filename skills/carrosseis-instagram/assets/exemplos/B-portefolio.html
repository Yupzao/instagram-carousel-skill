<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Carrossel — B. Portefólio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit/base.css">
<style>
  :root { --bg: #e9eef2; --ink: #0d0f12; }
  /* Substitui cada .ph por: <div class="media" style="background-image:url('fotos/x.jpg')"></div> */
  .cover-title { position: absolute; left: var(--pad); right: var(--pad); top: 300px; text-align: center; }
  .cover-title .kicker { font: 800 44px/1 var(--f-display); letter-spacing: .02em; }
  .cover-title .big { font: 900 230px/.85 var(--f-display); letter-spacing: -.06em; }
  /* Recorte do sujeito por cima do título (PNG com fundo transparente) */
  .cutout { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 62%; background: center bottom / contain no-repeat; }
</style>
</head>
<body>
<div class="carousel">

  <!-- 01 · CAPA: foto full-bleed + título enorme; o sujeito (.cutout) pode tapar parte do título -->
  <section class="slide">
    <div class="bleed"><div class="ph">Foto mais forte do conjunto (full-bleed)</div></div>
    <div class="cover-title"><div class="kicker">OUTONO</div><div class="big">PORTO</div></div>
    <div class="cutout" style="/* background-image:url('fotos/sujeito.png') */"></div>
  </section>

  <!-- 02 · Um tema por slide: 3 linhas -->
  <section class="slide">
    <div class="collage" style="grid-template-rows:1fr 1fr 1fr">
      <div class="ph">Plano geral — tema 1</div>
      <div class="ph">Detalhe — tema 1</div>
      <div class="ph">Ambiente — tema 1</div>
    </div>
  </section>

  <!-- 03 · 2 em cima + 1 larga em baixo -->
  <section class="slide">
    <div class="collage" style="grid-template-columns:1fr 1fr;grid-template-rows:1fr 1.3fr;gap:8px;background:#fff">
      <div class="ph">Detalhe A — tema 2</div>
      <div class="ph">Detalhe B — tema 2</div>
      <div class="ph" style="grid-column:1/3">Plano geral — tema 2</div>
    </div>
  </section>

  <!-- 04 · 1 grande + 2 pequenas -->
  <section class="slide">
    <div class="collage" style="grid-template-columns:1.6fr 1fr;grid-template-rows:1fr 1fr">
      <div class="ph" style="grid-row:1/3">Vertical forte — tema 3</div>
      <div class="ph">Detalhe — tema 3</div>
      <div class="ph">Detalhe — tema 3</div>
    </div>
  </section>

  <!-- 05 · Fecho: foto + CTA discreto -->
  <section class="slide">
    <div class="bleed"><div class="ph">Foto de fecho</div></div>
    <div class="scrim"></div>
    <div class="content bottom" style="color:#fff">
      <p class="lead"><b>Mais em @marca</b> · marcações abertas</p>
    </div>
  </section>

</div>
<script src="kit/carousel.js"></script>
</body>
</html>
